name: fashion-intelligence

services:
  server:
    image: ${SERVER_IMAGE:-fashion-intelligence-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    init: true
    environment:
      MODEL_DIR: /workspace/models
      FASHION_DATA_ROOT: /workspace/dataset
    volumes:
      - type: bind
        source: ${FASHION_DATA_ROOT:-./dataset}
        target: /workspace/dataset
        read_only: true
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    image: ${CLIENT_IMAGE:-fashion-intelligence-client:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    restart: unless-stopped
    init: true
    environment:
      BACKEND_URL: http://server:8000
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
